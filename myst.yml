  thebe:
    enabled: true
    binder:
      url: https://mybinder.org
      repo: EdgarManacorda/eprop_wired_paper
      ref: HEAD
    kernel:
      name: python3

  authors:
    - name: Edgar Manacorda
      roles:
        - Software
        - Visualization
        - Writing

  keywords:
    - spiking neural networks
    - e-prop
    - NEST Simulator
    - DVS Gesture
    - MC_Maze
    - interactive scientific publication

  github: EdgarManacorda/eprop_wired_paper
  venue: NeuroLibre
  subject: Living Preprint
  numbering:
    headings: true
  open_access: true
  license:
    content: CC-BY-4.0
