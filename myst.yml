  resources:
    - content/figure_dvs_results.ipynb
    - content/figure_mc_results.ipynb
    - content/Dash_client.py
    - content/data/dvs_training_log.csv
    - content/data/mc_maze_training_log.csv
    - downloads/dvs_gesture_native_nest_eprop.py
    - downloads/mc_maze_native_nest_eprop.py
    - downloads/make_interactive_training_figures.py
    - downloads/make_3d_unified_network_browser_per_family.py
    - downloads/dvs_gesture_interactive_training_curves.html
    - downloads/mc_maze_interactive_training_curves.html
    - downloads/dvs_gesture_3d_network.html
    - downloads/mc_maze_3d_network.html


site:
